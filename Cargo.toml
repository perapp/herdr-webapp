[package]
name = "herdr-webapp"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "A browser window onto Herdr Core"

[dependencies]
anyhow = "1"
base64 = "0.22"
http-body-util = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
qrcode = { version = "0.14", default-features = false }
futures-util = "0.3"
libc = "0.2"
mime_guess = "2"
rand = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
