[package]
name = "herdr-webapp"
version = "0.0.4"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "A browser window onto Herdr Core"

[workspace]
members = ["vendor/webrtc-ice"]
default-members = ["."]
resolver = "3"

[dependencies]
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
sha1 = "0.10"
sha2_10 = { package = "sha2", version = "0.10" }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
webrtc = "=0.17.3"
anyhow = "1"
base64 = "0.22"
http-body-util = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
qrcode = { version = "0.14", default-features = false }
futures-util = "0.3"
libc = "0.2"
mime_guess = "2"
rand = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

# Narrow upstream patch: verified TURN stream framing and TCP/TLS transports.
[patch.crates-io]
webrtc-ice = { path = "vendor/webrtc-ice" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
