name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag matching Cargo.toml (for example v0.0.1)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing tag, commit, and crate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('requires existing stable vX.Y.Z tag')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != git('rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'):
              raise SystemExit('checkout is not the requested tag commit')
          manifest = pathlib.Path('Cargo.toml').read_text()
          package = re.search(r'(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)', manifest)
          version = re.search(r'^version\s*=\s*"([^"]+)"\s*$', package[1], re.M)[1]
          if tag != 'v' + version:
              raise SystemExit('tag must match Cargo.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\nversion={version}\ncommit={git("rev-parse", "HEAD")}\n')
          PY
      - name: Read complete non-Windows release matrix
        id: matrix
        run: echo "matrix=$(python3 -B scripts/release-ci.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      HERDR_BUILD_REVISION: ${{ needs.verify.outputs.commit }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPENSSL_STATIC: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust and target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Target C compiler and execution prerequisites
        env:
          BUILD_TOOLCHAIN: ${{ matrix.toolchain }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          case "$BUILD_TOOLCHAIN" in
            aarch64-gnu)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
              ;;
            armv7-gnu)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
              ;;
            i686-gnu)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y gcc-multilib libc6-dev-i386
              ;;
            musl)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y musl-tools perl
              cc_key=$(printf '%s' "$RELEASE_TARGET" | tr '-' '_')
              linker_key=$(printf '%s' "$RELEASE_TARGET" | tr 'a-z-' 'A-Z_')
              printf 'CC_%s=musl-gcc\nCARGO_TARGET_%s_LINKER=musl-gcc\n' "$cc_key" "$linker_key" >> "$GITHUB_ENV"
              ;;
            darwin-x86)
              # Build with the Apple SDK and execute Intel code under Rosetta.
              arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
              ;;
            native) ;;
            *) echo 'Unknown release toolchain' >&2; exit 1 ;;
          esac
      - name: Frontend checks and embedded build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run lint
          npm test
          npm run build
      - name: Rust host checks (each target binary is executed below)
        run: |
          # macOS /var/folders aliases /private/var; security fixtures require canonical paths.
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo test --locked -p webrtc-ice --lib turn_stream
      - name: Distribution tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          python3 -B distribution/test_release.py
          python3 -B scripts/test_release_ci.py
          python3 -B distribution/test_relay_launcher.py
          python3 -B distribution/test_relay_catalog.py
          python3 -B scripts/relay-e2e/test_static.py
      - name: Build locked release and package
        run: |
          cargo build --release --locked --target '${{ matrix.target }}'
          python3 -B scripts/release-ci.py verify-binary \
            --target '${{ matrix.target }}' \
            --binary 'target/${{ matrix.target }}/release/herdr-webapp' \
            --version '${{ needs.verify.outputs.version }}' \
            --revision "$HERDR_BUILD_REVISION"
          sh scripts/package-release.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/herdr-webapp-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Assemble complete release manifest
        run: |
          python3 -B scripts/release-ci.py assemble --directory dist --version "$RELEASE_VERSION"
      - name: Create draft, upload, verify remote completeness, then publish
        run: |
          # Published releases are immutable here; re-runs may only resume a draft.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > dist/existing.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("dist/existing.json"))["isDraft"], "refusing to modify a published release"'
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Herdr Web $RELEASE_TAG" --notes 'Linux GNU x86_64, aarch64, ARMv7 and i686 (glibc 2.35+); static musl x86_64/aarch64; Intel and Apple Silicon macOS 11+. Windows excluded. 32-bit Linux requires a separately installed compatible Herdr Core. Authenticate gh for the installer. Includes the optional Pi metadata installer. The release installer can prepare missing compatible Core; existing Core and terminals are not restarted.' >/dev/null 2>&1 || { echo 'Draft creation failed'; exit 1; }
          fi
          rm -f dist/existing.json
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/SHA256SUMS dist/install.sh >/dev/null 2>&1 || { echo 'Asset upload failed; release remains draft'; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > dist/remote.json 2>/dev/null || { echo 'Remote manifest read failed'; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('dist')
          remote = json.loads((root / 'remote.json').read_text())
          expected = {p.name: p.stat().st_size for p in root.iterdir() if p.name != 'remote.json'}
          actual = {a['name']: a['size'] for a in remote['assets']}
          if not remote['isDraft'] or expected != actual:
              raise SystemExit('remote release manifest is incomplete; leaving draft unpublished')
          PY
          # Byte-verify uploaded assets as well as names and sizes before publication.
          mkdir dist/remote-bytes
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist/remote-bytes >/dev/null 2>&1 || { echo 'Remote asset verification download failed'; exit 1; }
          (cd dist/remote-bytes && sha256sum --check SHA256SUMS)
          cmp dist/SHA256SUMS dist/remote-bytes/SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest >/dev/null 2>&1 || { echo 'Complete draft could not be published'; exit 1; }
